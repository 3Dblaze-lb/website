<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DBlaze — Personalized 3D printed gifts</title>
<meta name="description" content="3D printed gifts delivered all over Lebanon: cedar keychains and personalized “My Village” desk maps. Cash on delivery or Whish.">
<meta property="og:title" content="3DBlaze — Personalized 3D printed gifts">
<meta property="og:description" content="Personalized 3D printed gifts. Delivery all over Lebanon. Cash or Whish.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0F12'/%3E%3Cpath d='M18 4 L9 18 H15 L13 28 L23 13 H17 Z' fill='%231A8CFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F7FA; --soft2:#EEF2F7; --line:#E3E8EF; --line2:#D3DAE4;
  --text:#0B1220; --muted:#5B6472; --blue:#1A8CFF; --accent:#0A6FE0; --accent2:#0A6FE0; --accent3:#1A8CFF; --tint:#EAF4FF;
  --green:#12804A; --red:#D7262C; --xmas:#F2F8F4;
  --r:18px; --head:'Space Grotesk',system-ui,sans-serif; --brand:'Unbounded',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  /* legacy names used by markup */
  --ink:#0B1220; --card:#FFFFFF; --card2:#F5F7FA;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.025em;line-height:1.1;font-weight:700}
h2{font-size:clamp(28px,3.4vw,40px)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}

/* motion */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.soon .soon-blur.rv.in,.soon .rv.in .soon-blur{opacity:.85}
.pcard{transition:transform .25s ease,box-shadow .25s ease,opacity .7s cubic-bezier(.2,.7,.2,1)!important}
.pcard.in:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(11,18,32,.12)}
header.top{transition:box-shadow .25s ease,background .25s ease}
header.top.scrolled{box-shadow:0 6px 24px rgba(11,18,32,.08);background:rgba(255,255,255,.96)}
.sectabs{position:fixed;top:14px;left:50%;z-index:41;display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;box-shadow:0 10px 30px rgba(11,18,32,.10);transform:translate(-50%,-140%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.links a.sx{transition:opacity .25s,max-width .35s,padding .35s;max-width:140px;overflow:hidden;white-space:nowrap}
@media (min-width:901px){body.tabs-on .links a.sx{opacity:0;max-width:0;padding:0;pointer-events:none}}
.sectabs::-webkit-scrollbar{display:none}
.sectabs.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.sectabs a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);padding:9px 16px;border-radius:99px;transition:background .2s,color .2s}
.sectabs a:hover{color:var(--text);background:var(--soft)}
.sectabs a.on{background:var(--text);color:#fff}
.scrollprog{position:fixed;top:0;left:0;right:0;height:3px;background:var(--blue);transform-origin:0 50%;transform:scaleX(0);z-index:60;pointer-events:none}
.hero h1 .bl{display:inline-block;animation:heroPop 1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes heroPop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.stage{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}
[id^=sec-]{scroll-margin-top:84px}
@media (max-width:900px){.sectabs{top:80px;z-index:39}}
@media (max-width:720px){.sectabs{top:76px}.sectabs a{padding:8px 12px;font-size:13px}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.stage,.hero h1 .bl{animation:none}}

/* bar + header */
.announce{background:var(--text);color:#fff;text-align:center;font-size:14px;font-weight:500;padding:9px 16px}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.8) blur(14px);-webkit-backdrop-filter:saturate(1.8) blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--brand);font-weight:900;font-size:21px;letter-spacing:-.03em;color:var(--text)}
.logo svg{width:26px;height:31px}
.logo .b{color:var(--blue)}
.links{display:flex;align-items:center;gap:4px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;font-weight:500;color:#2C3443;font-size:15px}
.links a:hover{background:var(--soft)}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--text);color:#fff!important;font-weight:600!important;min-height:44px;margin-left:6px}
.cartbtn:hover{background:#1f2a3d!important}
.cartbtn b{background:#fff;color:var(--text);border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
@media (max-width:720px){.links a.navl{display:none}.logo{font-size:18px}.wrap{padding:0 18px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:12px;padding:13px 22px;min-height:50px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s, background .2s, border-color .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--text);color:#fff}
.btn.pri:hover{background:#273246}
.btn.sec{background:#fff;color:var(--text);border-color:var(--line2)}
.btn.sec:hover{border-color:var(--text)}
.btn.blue{background:var(--text);color:#fff}
.btn.wa{background:#1FAF54;color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* hero */
.hero{padding:64px 0 36px;position:relative;overflow:hidden;background:linear-gradient(180deg,#F4F8FE 0%,#fff 100%)}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.hero .grid>*{min-width:0}
@media (max-width:900px){.hero .grid{grid-template-columns:minmax(0,1fr);gap:28px}.hero{padding-top:40px}}
.hero h1{font-size:clamp(40px,5.6vw,68px);font-weight:700;letter-spacing:-.035em}
.hero h1 .o{color:var(--blue)} .hero h1 .bl{color:var(--blue)}
.hero p.lead{font-size:19px;color:#3A4352;max-width:520px;margin:20px 0 30px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;color:#2C3443}
.chip i{width:8px;height:8px;border-radius:9px;background:var(--green);display:inline-block}
.stage{background:#fff;border:1px solid var(--line);border-radius:28px;padding:20px;position:relative;box-shadow:var(--shadow)}
.stage .art{aspect-ratio:1;max-width:440px;margin:0 auto;background:radial-gradient(circle at 50% 45%,#E6F2FF,#fff 65%);border-radius:20px}
.try{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px;margin-top:14px}
.try span{font-size:14px;color:var(--muted)}
.layerlines{display:none}

/* countdown */
.count{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:28px 0 0;box-shadow:var(--shadow)}
.count .t{display:flex;gap:8px}
.count .u{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:66px;text-align:center}
@media (max-width:400px){.count .t{width:100%}.count .u{min-width:0;flex:1;padding:8px 4px}}
.count .u b{display:block;font-family:var(--head);font-size:24px;font-weight:700}
.count .u small{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.flagbar{display:inline-block;width:32px;height:21px;border-radius:3px;background:linear-gradient(var(--red) 0 25%,#fff 25% 75%,var(--red) 75%);vertical-align:middle;margin-right:10px;position:relative;box-shadow:0 0 0 1px var(--line)}
.flagbar:after{content:"";position:absolute;left:12px;top:6.5px;border:4px solid transparent;border-bottom:8px solid #1FA14E;border-top:0}

/* sections */
section.blk{padding:80px 0}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.sechead p{margin:12px 0 0;color:var(--muted);max-width:560px;font-size:17px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
.pcard .art{aspect-ratio:1;background:var(--soft);position:relative}
.pcard .art img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9AA4B2;text-align:center;padding:16px;background:var(--soft)}
.ph svg{width:30%;max-width:56px;color:#B4BDC9}
.ph span{color:#3A4352;font-weight:600;font-size:14px;line-height:1.3;max-width:90%}
.ph small{font-size:12px;color:#8C96A4}
.pcard .ph span,.line .ph span,.line .ph small,.prow .ph span,.prow .ph small,.qcard .ph span,.qcard .ph small{display:none}
.mapart{width:100%;height:100%;background:radial-gradient(circle at 50% 42%,#E3F0FF,#F5F7FA 70%)}
.mapart svg{width:100%;height:100%}
.geo{font-size:13px;min-height:20px;margin:10px 2px 0}
.try input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:17px;font-weight:500;min-height:40px}
.heroBolt{display:flex;align-items:center;justify-content:center;padding:14%}
.heroBolt svg{width:100%;height:100%;filter:drop-shadow(0 24px 40px rgba(26,140,255,.28))}
.pcard .tag{position:absolute;top:12px;left:12px;background:#fff;color:var(--text);font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;box-shadow:0 1px 3px rgba(11,18,32,.12)}
.pcard .tag.out{background:var(--text);color:#fff}
.pcard .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard h3{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.pcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px}
.price{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:-.02em}
.price s{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.add{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px;display:inline-flex;align-items:center}
.pcard:hover .add{background:var(--text);color:#fff;border-color:var(--text)}

.xmas{background:var(--xmas);border-top:1px solid #DDEBE2;border-bottom:1px solid #DDEBE2}
.xmas .eyebrow{color:var(--green)}
.soon .soon-blur{filter:blur(7px);pointer-events:none;user-select:none;opacity:.85}
.soon-badge{display:table;margin:0 auto 22px;background:var(--text);color:#fff;font-family:var(--head);font-weight:700;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.01em;padding:12px 28px;border-radius:99px;position:relative;z-index:2}

.snow{display:none}
.cut{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #CFE3D6;color:#0F5E37;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .n{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);background:var(--tint);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.step h3{font-size:18px;margin:16px 0 6px}
.step p{margin:0;color:var(--muted);font-size:15px}

.pay{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.pay{grid-template-columns:1fr}}
.paycard{border-radius:var(--r);padding:28px;border:1px solid var(--line);background:var(--soft)}
.paycard .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:#fff;border:1px solid var(--line)}
.paycard .ic svg{width:24px;height:24px;color:var(--accent)}
.paycard h3{font-size:20px;margin-bottom:8px}
.paycard p{margin:0;color:var(--muted)}

.faq{max-width:820px}
.faq details{background:#fff;border-bottom:1px solid var(--line);padding:0 4px}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;padding:20px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--muted);font-size:22px;line-height:1;font-weight:400}
.faq details[open] summary:after{content:"–"}
.faq details p{margin:0 0 20px;color:#3A4352}

footer{border-top:1px solid var(--line);padding:44px 0 60px;color:var(--muted);font-size:14px;background:var(--soft)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}

/* product page */
.ppage{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:28px 0 80px}
@media (max-width:860px){.ppage{grid-template-columns:1fr;gap:24px}}
.ppage .big{background:var(--soft);border:1px solid var(--line);border-radius:24px;aspect-ratio:1;position:sticky;top:96px;overflow:hidden}
@media (max-width:860px){.ppage .big{position:static}}
.ppage .big img{width:100%;height:100%;object-fit:cover}
.ppage h1{font-size:clamp(30px,4vw,42px);margin:10px 0 12px}
.ppage .price{font-size:28px}
.opt{margin-top:26px}
.opt .lab{font-size:14px;color:var(--text);font-weight:600;margin-bottom:10px;display:block}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:99px;padding:6px 14px 6px 6px;cursor:pointer;min-height:44px;font-weight:500;text-transform:capitalize}
.sw i{width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(11,18,32,.15)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.sw img{width:28px;height:28px;border-radius:99px;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(11,18,32,.15)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.sw small{font-size:11px;color:var(--muted,#6B7380);text-transform:none;margin-left:2px}
.field{display:flex;flex-direction:column;gap:7px;font-size:14px;color:#2C3443;font-weight:600}
.field input,.field select,.field textarea{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:16px;font-weight:400;color:var(--text);min-height:48px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:3px solid rgba(26,140,255,.25);border-color:var(--blue)}
.qty{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:12px}
.qty button{width:46px;height:48px;background:none;border:0;font-size:20px;cursor:pointer}
.qty span{min-width:34px;text-align:center;font-weight:600}
.buyrow{display:flex;gap:12px;margin-top:28px}
.buyrow .btn{flex:1}
.specs{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:10px}
.specs div{display:flex;gap:12px;color:#2C3443;font-size:15px}
.specs div:before{content:"";flex:none;width:6px;height:6px;margin-top:9px;border-radius:9px;background:var(--blue)}
.back{display:inline-flex;margin-top:24px;color:var(--muted);text-decoration:none;font-size:15px}
.back:hover{color:var(--text)}

/* cart & checkout */
.page{padding-top:40px;padding-bottom:90px}
.page h1{font-size:clamp(30px,4vw,40px);margin-bottom:24px}
.two{display:grid;grid-template-columns:1.35fr .65fr;gap:28px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel h3{font-size:17px;margin-bottom:16px}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .th{width:72px;height:72px;border-radius:12px;background:var(--soft);overflow:hidden}
.line .th img{width:100%;height:100%;object-fit:cover}
.line .nm{font-weight:600}
.line .meta{font-size:13px;color:var(--muted)}
.line .ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.line .ctl button{background:#fff;border:1px solid var(--line2);border-radius:8px;width:32px;height:32px;cursor:pointer}
.line .rm{background:none!important;border:0!important;color:var(--muted);width:auto!important;font-size:13px;text-decoration:underline}
.sum{display:grid;gap:10px;font-size:15px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-family:var(--head);font-weight:700;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.grid2 .wide{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.grid3{grid-template-columns:1fr 1fr}}
.paysel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.paysel{grid-template-columns:1fr}}
.paysel label{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:16px;cursor:pointer}
.paysel input{accent-color:var(--text);width:20px;height:20px;margin-top:2px}
.paysel label.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text);background:#fff}
.paysel b{display:block}
.paysel small{color:var(--muted);font-size:13px}
.note{background:var(--tint);border:1px solid #CFE4FB;border-radius:12px;padding:14px 16px;font-size:14px;color:#0D3A6B;margin-top:14px}
.empty{text-align:center;padding:60px 20px}
.empty .btn{margin-top:20px}
.err{color:var(--red);font-size:13px;min-height:18px}

.done{max-width:640px;margin:0 auto;text-align:center}
.done .ok{width:76px;height:76px;border-radius:22px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.code{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.04em;background:var(--soft);border:1px dashed var(--line2);border-radius:14px;display:inline-block;padding:10px 20px;margin:12px 0 20px}
.done .panel{text-align:left;margin-top:16px}
.timeline{display:grid;gap:0;margin-top:10px}
.tl{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding-bottom:16px;position:relative}
.tl:before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl:last-child:before{display:none}
.tl i{width:28px;height:28px;border-radius:99px;background:#fff;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.tl.on i{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
.tl.cur b{color:var(--text)}
.tl small{display:block;color:var(--muted);font-size:13px}

/* toast + modal */
.toast{opacity:0;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:100;transition:transform .3s,opacity .3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(11,18,32,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(11,18,32,.45);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal .box{background:#fff;border-radius:20px;width:100%;max-width:720px;padding:26px;position:relative;box-shadow:0 20px 60px rgba(11,18,32,.3)}
.modal .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:10px;background:var(--soft);border:1px solid var(--line);cursor:pointer;font-size:16px}

/* admin */
.admin{padding-top:28px;padding-bottom:90px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.adm-top h1{font-size:28px}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--muted);min-height:42px}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(11,18,32,.12)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media (max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
.kpi.live{background:#F1FAF5;border-color:#CDEBD9}.kpi.live b{color:var(--green)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--green);margin-right:6px;vertical-align:1px;animation:livepulse 1.6s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}

.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--head);font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi.o b{color:var(--accent)} .kpi.g b{color:var(--green)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:7px 14px;font-weight:500;font-size:14px;cursor:pointer;min-height:38px}
.fchip.on{background:var(--text);color:#fff;border-color:var(--text)}
.fchip em{font-style:normal;opacity:.6;margin-left:4px}
.search{flex:1;min-width:200px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 14px;min-height:42px}
.olist{display:grid;gap:8px}
.orow{display:grid;grid-template-columns:110px 1.3fr 1.6fr 90px 130px 90px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:14px}
.orow:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.orow .c{font-family:var(--head);font-weight:700;font-size:13px}
.orow .n b{display:block;font-size:15px}
.orow .n small,.orow .it small{color:var(--muted)}
.orow .tt{font-family:var(--head);font-weight:700;text-align:right}
@media (max-width:900px){.orow{grid-template-columns:1fr auto;}.orow .it,.orow .pm{display:none}}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:9px;background:currentColor}
.s-new{background:#E6F1FF;color:#0A5BC0}
.s-confirmed{background:#EEF0FF;color:#4048B8}
.s-printing{background:#F3ECFF;color:#6A3DC2}
.s-ready{background:#E3F7F6;color:#0E7470}
.s-out{background:#E7F7EE;color:#167A45}
.s-delivered{background:#DDF3E6;color:#0E6136}
.s-cancelled{background:#F0F2F5;color:#677180}
.paid{color:var(--green);font-weight:600;font-size:13px}
.unpaid{color:#B4232A;font-weight:600;font-size:13px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.stepper button{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;min-height:40px}
.stepper button.on{background:var(--text);color:#fff;border-color:var(--text)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:15px;margin:10px 0 18px}
.kv span{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{min-height:44px;padding:10px 16px;font-size:14px}
.prow{display:grid;grid-template-columns:60px 1fr 110px 120px 130px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
@media (max-width:760px){.prow{grid-template-columns:60px 1fr;}.prow>*:nth-child(n+3){grid-column:2}}
.prow .th{width:60px;height:60px;border-radius:10px;background:var(--soft);overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow input[type=number]{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%;min-height:40px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--text)}
.upl{font-size:13px;color:var(--accent);cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font-weight:500}
.upl:hover{text-decoration:underline}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;margin-bottom:8px}
.qcard .th{width:52px;height:52px;border-radius:10px;background:var(--soft);overflow:hidden}
.qcard .names{font-size:13px;color:var(--accent);margin-top:4px}
.login{max-width:420px;margin:60px auto;text-align:center}
.login .panel{text-align:left;display:grid;gap:14px;margin-top:20px}
.demo{background:var(--tint);border:1px solid #CFE4FB;color:#0D3A6B;border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:16px}

/* calculator */
.calc{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.preset{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;min-height:38px}
.preset.on{background:var(--text);color:#fff;border-color:var(--text)}
.toggles{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tog{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;min-height:44px;font-weight:500}
.tog input{width:18px;height:18px;accent-color:var(--text)}
.hint{color:var(--muted);font-size:13px;margin:14px 0 0}
.res{position:sticky;top:96px}
.res .big{font-family:var(--head);font-weight:700;font-size:56px;letter-spacing:-.03em;line-height:1;margin:8px 0 6px}
.res .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:var(--soft);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--head);font-weight:700;font-size:18px;margin-top:4px}
.stat .v.good{color:var(--green)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0 10px}
.bar div{height:100%;transition:width .3s}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
.legend span{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.legend b{color:var(--text);font-weight:600;float:right}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:2px dashed var(--line2);border-radius:14px;padding:22px 16px;cursor:pointer;background:var(--soft);transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--text);background:#fff}
.drop span{font-size:13px;color:var(--muted);max-width:460px}
.quote{background:var(--soft);border:1px dashed var(--line2);border-radius:12px;padding:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;margin:8px 0 12px}
</style>
</head>
